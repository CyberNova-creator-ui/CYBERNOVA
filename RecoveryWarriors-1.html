    // Reusable Map Component
    function LeafletMapView({ center, zoom, reports, showEmergencyRoute, emergencyReport }) {
      const mapRef = useRef(null);
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        
        if (!mapRef.current) {
          mapRef.current = L.map(containerRef.current).setView(center || [23.3701, 85.3250], zoom || 13);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap & CARTO'
          }).addTo(mapRef.current);
        } else {
          mapRef.current.setView(center || [23.3701, 85.3250], zoom || 13);
        }

        const map = mapRef.current;

        map.eachLayer((layer) => {
          if (layer instanceof L.Marker || layer instanceof L.Circle || layer instanceof L.Polyline) {
            map.removeLayer(layer);
          }
        });

        reports.forEach(r => {
          const isEm = r.isEmergency || r.riskScore >= 85 || (r.priorityTags && r.priorityTags.length > 0);
          const bg = isEm ? '#ef4444' : r.department === 'electrical' ? '#eab308' : r.department === 'water' ? '#06b6d4' : '#f97316';
          const emoji = r.category === 'live_wire' ? '⚡' : isEm ? '🚨' : r.department === 'electrical' ? '💡' : r.department === 'water' ? '🌊' : '🛣️';

          const customIcon = L.divIcon({
            className: 'custom-icon',
            html: `
              <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px;">
                ${isEm ? '<div class="emergency-marker-ring"></div>' : ''}
                <div style="background-color: ${bg}; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                  ${emoji}
                </div>
              </div>
            `,
            iconSize: [34, 34],
            iconAnchor: [17, 17]
          });

          const marker = L.marker([r.location.lat, r.location.lng], { icon: customIcon }).addTo(map);
          marker.bindPopup(`
            <div style="font-family: sans-serif; color: #1e293b; padding: 2px; max-width: 200px;">
              <div style="font-weight: 800; font-size: 11px; color: ${isEm ? '#dc2626' : '#047857'};">${r.trackingId}</div>
              <div style="font-weight: 700; font-size: 12px; margin-top: 2px;">${r.title}</div>
              <div style="font-size: 10px; color: #64748b; margin-top: 2px;">${r.location.address}</div>
              <div style="font-size: 10px; font-weight: 700; margin-top: 4px; color: #d97706;">Risk Score: ${r.riskScore}/100</div>
              <div style="font-size: 9px; font-weight: 800; color: ${r.officerAccepted ? '#059669' : '#d97706'}; margin-top: 2px;">
                ${r.officerAccepted ? 'Officer Sachin Accepted ✅' : 'Pending Officer Acceptance ⏳'}
              </div>
            </div>
          `);
        });

        // Live Emergency Vehicle Tracker
        if (showEmergencyRoute && emergencyReport && emergencyReport.emergencyTracking) {
          const t = emergencyReport.emergencyTracking;
          
          L.polyline([
            [t.startLocation.lat, t.startLocation.lng],
            [t.currentLocation.lat, t.currentLocation.lng],
            [emergencyReport.location.lat, emergencyReport.location.lng]
          ], { color: '#ef4444', weight: 4, dashArray: '6, 6' }).addTo(map);

          const vehicleIcon = L.divIcon({
            html: `<div style="background:#dc2626; border:2px solid white; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 4px 10px rgba(0,0,0,0.6);">🚒</div>`,

            iconAnchor: [18, 18]
          });

            .bindPopup(`<b>🚒 ${t.vehicleNumber}</b><br>Lead: ${t.warriorLeadName}<br>ETA: ~${t.etaMinutes} mins`).openPopup();
        }

      return <div ref={containerRef} className="w-full h-full min-h-[300px] rounded-xl border border-slate-700 shadow-xl overflow-hidden"></div>;

      const t = translations[lang] || translations.en;

      // Play Siren Tone for Priority Alarms
      const playSiren = () => {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.6);
        } catch (e) {}
      };

      // Voice Assistant TTS in active language
      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = lang === 'ta' ? 'ta-IN' : lang === 'hi' ? 'hi-IN' : 'en-IN';
          window.speechSynthesis.speak(u);
        }
      };

      // Voice Assistant STT for global guide
      const toggleVoice = () => {
        if (isListening) {
          setIsListening(false);
        } else {
          const prompt = lang === 'ta' 
            ? "வணக்கம்! உங்கள் பிரச்சனையை சொல்லுங்கள் (மின் கம்பி, ரோடு குழி, தெரு விளக்கு, சாக்கடை, கட்டிடம்)."
            : lang === 'hi'
            ? "नमस्ते! कृपया अपनी समस्या बोलें, जैसे बिजली का तार, गड्ढा, स्ट्रीट लाइट या नाली।"
            : "Hello! Please speak your complaint (Live wire, Pothole, Street Light, Drainage, Collapse).";
          speakText(prompt);

          const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SpeechRec) {
            const rec = new SpeechRec();
            rec.lang = lang === 'ta' ? 'ta-IN' : lang === 'hi' ? 'hi-IN' : 'en-IN';
            rec.onstart = () => setIsListening(true);
            rec.onresult = (e) => {
              const res = e.results[0][0].transcript;
              setVoiceText(res);
              setTitle(res);
              setDesc(`Voice complaint: "${res}"`);
              
              const lower = res.toLowerCase();
              if (lower.includes('wire') || lower.includes('கம்பி') || lower.includes('तार')) setCat('live_wire');
              else if (lower.includes('light') || lower.includes('விளக்கு') || lower.includes('लाइट')) setCat('broken_streetlight');
              else if (lower.includes('drain') || lower.includes('சாக்கடை') || lower.includes('नाली')) setCat('drainage_blockage');
              else if (lower.includes('collapse') || lower.includes('இடிந்து') || lower.includes('इमारत')) setCat('structure_collapse');
              else setCat('pothole_road');
            };
            rec.onend = () => setIsListening(false);
            rec.onerror = () => setIsListening(false);
            rec.start();
          }
        }
      };

      // Dedicated Voice Recognition in Description Box (Requirement 5)
      const toggleDescVoice = () => {
        if (isDescListening) {
          setIsDescListening(false);
        } else {
          speakText(lang === 'ta' ? "விளக்கத்தை இப்போது பேசுங்கள்." : lang === 'hi' ? "कृपया विवरण बोलें।" : "Please speak the description details.");

          const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SpeechRec) {
            const rec = new SpeechRec();
            rec.lang = lang === 'ta' ? 'ta-IN' : lang === 'hi' ? 'hi-IN' : 'en-IN';
            rec.onstart = () => setIsDescListening(true);

                      <div>
                        <h2 className="text-xl font-bold text-white">👮 Officer Sachin K (Incident Commander)</h2>
                        <p className="text-xs text-slate-400">Department Authority & Emergency Warriors Command</p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => setIsViewingReport(true)} className="bg-amber-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow">
                          🧾 Monday 8:00 AM Report
                        </button>
                        <button onClick={() => setIsOfficerAuth(false)} className="bg-slate-700 text-slate-200 text-xs font-bold px-3 py-2 rounded-xl">
                          Logout
                        </button>
                      </div>
                    </div>

                    {/* Department Communities */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                      <div className="bg-slate-800 p-3 rounded-xl border border-orange-500/40">
                        <strong className="text-orange-300 block">🛣️ Road Maintenance</strong>
                        <span className="text-slate-400 text-[10px]">Pothole & Pavements</span>
                      </div>
                      <div className="bg-slate-800 p-3 rounded-xl border border-amber-500/40">
                        <strong className="text-amber-300 block">💡 Electrical Dept</strong>
                        <span className="text-slate-400 text-[10px]">Street Light Repair</span>
                      </div>
                      <div className="bg-slate-800 p-3 rounded-xl border border-cyan-500/40">
                        <strong className="text-cyan-300 block">🌊 Storm Water Drain</strong>
                        <span className="text-slate-400 text-[10px]">Drainage & Floods</span>
                      </div>
                      <div className="bg-slate-800 p-3 rounded-xl border border-red-500/40">
                        <strong className="text-red-300 block">🚒 Fire & Rescue / Live Wire</strong>
                        <span className="text-slate-400 text-[10px]">Emergency Warriors</span>
                      </div>
                    </div>

                    {/* Issues List */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                      <div className="lg:col-span-7 space-y-4">
                        <h3 className="text-base font-bold text-white">🔥 Incoming Grievance Queue</h3>
                        {reports.map(r => (
                          <div key={r.id} className={`bg-slate-800 border p-4 rounded-2xl space-y-3 ${r.priorityTags?.length > 0 ? 'border-red-500 bg-red-950/20' : !r.officerAccepted ? 'border-amber-500' : 'border-slate-700'}`}>
                            <div className="flex justify-between items-center text-xs">
                              <span className="font-mono text-amber-400 font-bold">{r.trackingId}</span>
                              <span className="text-slate-400 uppercase font-bold">{r.department}</span>
                            </div>

                            {r.priorityTags?.length > 0 && (
                              <div className="bg-red-900/80 text-white text-xs px-2 py-1 rounded-lg font-bold">
                                🚨 Safety Alert: {r.priorityTags.map(t => t.replace('_', ' ')).join(', ')}
                              </div>
                            )}

                            <h4 className="font-bold text-sm text-white">{r.title}</h4>
                            <p className="text-xs text-slate-300">{r.description}</p>
                            
                            {r.mediaType === 'video' && r.videoUrl ? (
                              <video src={r.videoUrl} controls className="w-full aspect-video rounded-xl bg-black object-contain" />
                            ) : (
                              <img src={r.photos.reportPhotoUrl} className="w-full aspect-video rounded-xl object-cover" />
                            )}

                            <div className="pt-2 border-t border-slate-700 flex gap-2">
                              {!r.officerAccepted ? (
                                <>
                                  <button
                                    onClick={() => handleOfficerAccept(r.id)}
                                    className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs shadow"
                                  >
                                    ✅ Accept & Route to {r.department.toUpperCase()} Dept
                                  </button>
                                  {(r.category === 'live_wire' || r.category === 'structure_collapse') && (
                                    <button
                                      onClick={() => handleDeployEmergency(r.id)}
                                      className="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-3 rounded-xl text-xs animate-pulse shadow"
                                    >
                                      🚨 Deploy Emergency Warriors
                                    </button>
                                  )}
                                </>
                              ) : (
                                <span className="text-xs text-emerald-400 font-bold">
                                  ✅ Accepted by Officer Sachin • Assigned to {r.department.toUpperCase()} team
                                </span>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>

                      <div className="lg:col-span-5 space-y-4">
                        <div className="bg-slate-800 border border-slate-700 p-4 rounded-2xl">
                          <h4 className="text-sm font-bold text-white mb-2">🚒 Emergency Warriors Live Tactical Radar</h4>
                          <div className="h-[360px]">
                            <LeafletMapView reports={reports} showEmergencyRoute={true} emergencyReport={emergencyRep} center={[23.3701, 85.3250]} zoom={13} />
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 3. WORKER PORTAL */}
            {role === 'worker' && !isViewingReport && (
              <div className="space-y-6">
                <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
                  <h2 className="text-xl font-bold text-white">👷 Department Field Worker Portal</h2>
                  <p className="text-xs text-slate-400">Showing only tasks authorized & accepted by Officer Sachin</p>
                </div>

                <div className="space-y-3">
                  {reports.filter(r => r.officerAccepted).map(task => (
                    <div key={task.id} className="bg-slate-800 border border-slate-700 p-5 rounded-2xl space-y-3">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-mono text-amber-400 font-bold">{task.trackingId}</span>
                        <span className="text-emerald-400 font-bold">Officer Sachin Approved ✅</span>
                      </div>
                      <h4 className="font-bold text-sm text-white">{task.title}</h4>
                      <p className="text-xs text-slate-400">{task.location.address}</p>

                      <div className="flex gap-2 pt-2">
                        <button
                          onClick={() => alert('GPS Check-in confirmed at site! ✅')}
                          className="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs"
                        >
                          📍 GPS Check-in
                        </button>
                        <label className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs cursor-pointer shadow flex items-center gap-1">
                          📸 Upload Resolution Photo
                          <input
                            type="file"
                            accept="image/*"
                            onChange={(e) => {
                              const f = e.target.files?.[0];
                              if (f) {
                                const rd = new FileReader();
                                rd.onload = (ev) => {
                                  setReports(reports.map(r => r.id === task.id ? { ...r, status: 'awaiting_verification', photos: { ...r.photos, completionPhotoUrl: ev.target.result } } : r));
                                  alert('Resolution photo uploaded and forwarded to Officer Sachin!');
                                };
                                rd.readAsDataURL(f);
                              }
                            }}
                            className="hidden"
                          />
                        </label>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 4. PUBLIC WALL */}
            {role === 'public' && !isViewingReport && (
              <div className="space-y-4">
                <div className="bg-slate-800 border border-slate-700 p-5 rounded-2xl">
                  <h2 className="text-xl font-bold text-white">📣 Public Transparency Wall</h2>
                </div>
                {reports.map(r => (
                  <div key={r.id} className="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center">
                    <div>
                      <span className="font-mono text-amber-400 font-bold text-xs">{r.trackingId}</span>
                      <h4 className="font-bold text-white text-sm">{r.title}</h4>
                      <p className="text-xs text-slate-400">{r.location.address}</p>
                    </div>
                    <button
                      onClick={() => window.open(`https://api.whatsapp.com/send?text=Track%20${r.trackingId}%20on%20RecoveryWarriors`, '_blank')}
                      className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow"
                    >
                      Share WhatsApp
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* 5. DISTRICT COLLECTOR REPORT */}
            {(role === 'district_collector' || isViewingReport) && (
              <div className="space-y-4">
                <div className="no-print flex justify-between">
                  <button onClick={() => setIsViewingReport(false)} className="bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-xl">← Back</button>
                  <button onClick={() => window.print()} className="bg-emerald-600 text-white text-xs font-bold px-4 py-1.5 rounded-xl">🖨️ Print PDF</button>
                </div>
                <div className="bg-white text-slate-900 p-8 rounded-2xl shadow-xl space-y-4 font-serif">
                  <div className="text-center border-b pb-3 font-sans">
                    <h2 className="text-xl font-bold">Government of Jharkhand</h2>
                    <p className="text-xs text-slate-600">Weekly Executive Briefing • Auto Generated Monday 8:00 AM</p>
                  </div>
                  <div className="grid grid-cols-4 gap-2 text-center font-sans">
                    <div className="bg-slate-100 p-2 rounded"><strong className="block text-lg">148</strong><span className="text-[10px] text-slate-500">Reported</span></div>
                    <div className="bg-emerald-50 p-2 rounded text-emerald-800"><strong className="block text-lg">131</strong><span className="text-[10px]">Resolved</span></div>
                    <div className="bg-blue-50 p-2 rounded text-blue-800"><strong className="block text-lg">18.4h</strong><span className="text-[10px]">Avg SLA</span></div>
                    <div className="bg-amber-50 p-2 rounded text-amber-800"><strong className="block text-lg">94.6%</strong><span className="text-[10px]">Rating</span></div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
